<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Agent Login — Next Stage Talent</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: #0d1b2a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box {
      background: #fff;
      border-radius: 14px;
      padding: 56px 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .login-logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #0d1b2a; margin-bottom: 4px; }
    .login-logo span { color: #c9a96e; }
    .login-sub { font-size: 11px; color: #8a99a8; margin-bottom: 36px; letter-spacing: 0.1em; text-transform: uppercase; }
    .agent-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: #f0f7fc; color: #4a82a6; border: 1px solid #c3dff0;
      border-radius: 100px; padding: 5px 14px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      margin-bottom: 28px;
    }
    .agent-badge::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4a82a6; }
    .pass-wrap { position: relative; }
    .pass-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 14px; color: #8a99a8; background: none; border: none; padding: 4px; }
    .login-error { display: none; background: #fff5f0; color: #c0533a; padding: 12px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .submit-btn {
      width: 100%; justify-content: center; margin-top: 8px;
      background: #0d1b2a; color: #fff; border: none; border-radius: 8px;
      padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .submit-btn:hover { background: #1e2d3d; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: #4a5568; margin-bottom: 8px; letter-spacing: 0.04em; }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 8px; font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.2s; box-sizing: border-box;
    }
    .form-input:focus { border-color: #4a82a6; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">Next Stage<span>.</span></div>
    <div class="login-sub">Agent Portal</div>
    <div class="agent-badge">Agent Access</div>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" class="form-input" placeholder="Enter agent password" required autocomplete="current-password" />
          <button type="button" class="pass-toggle" onclick="togglePass()">👁</button>
        </div>
      </div>
      <button type="submit" class="submit-btn" id="login-btn">Sign In</button>
    </form>
    <p style="margin-top:24px;text-align:center;font-size:12px;color:#a0aec0;">Authorised agents only.</p>
  </div>

  <script>
    fetch('/api/agent/check').then(r => r.json()).then(d => {
      if (d.authenticated) window.location = '/admin/agent-dashboard.html';
    });

    function togglePass() {
      const f = document.getElementById('password');
      f.type = f.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const res = await fetch('/api/agent/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('password').value })
      });

      if (res.ok) {
        window.location = '/admin/agent-dashboard.html';
      } else {
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
